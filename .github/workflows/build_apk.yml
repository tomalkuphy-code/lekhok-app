name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'

      - name: Create Complete Android Project Structure Automatically
        run: |
          # Create all required directories
          mkdir -p android/app/src/main/java/com/example/lekhok_app
          
          # Create AndroidManifest.xml structure
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.example.lekhok_app"><uses-permission android:name="android.permission.INTERNET" /><application android:label="Lekhok.me" android:icon="@mipmap/ic_launcher"><activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTop" android:theme="@style/LaunchTheme" android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|screenLayout|density|uiMode" android:hardwareAccelerated="true"><intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter></activity><meta-data android:name="flutterEmbedding" android:value="2" /></application></manifest>' > android/app/src/main/AndroidManifest.xml
          
          # Create MainActivity.java to resolve Android v2 Embedding
          echo 'package com.example.lekhok_app; import io.flutter.embedding.android.FlutterActivity; public class MainActivity extends FlutterActivity { }' > android/app/src/main/java/com/example/lekhok_app/MainActivity.java

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-pub

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lekhok-me-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
