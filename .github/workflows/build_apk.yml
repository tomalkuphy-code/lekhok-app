name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'

      - name: Recreate Safe Flutter Structure
        run: |
          # ব্যাকআপ ও পুরোনো ফাইল ক্লিনআপ
          mkdir -p ../temp_lib
          cp -r lib/* ../temp_lib/ || true
          cp pubspec.yaml ../temp_pubspec.yaml || true
          rm -rf * .github
          
          # ফ্রেশ প্রজেক্ট জেনারেট (যা সব কনফিগারেশন অটোমেটিক v2 এমবেডিংয়ে সেট করবে)
          flutter create --platforms=android .
          
          # আপনার কাস্টম কোড ও ডিপেন্ডেন্সি ফিরিয়ে আনা
          rm -rf lib
          mkdir -p lib
          cp -r ../temp_lib/* lib/ || true
          cp ../temp_pubspec.yaml pubspec.yaml || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lekhok-me-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
